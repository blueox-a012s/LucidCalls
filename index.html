<!DOCTYPE html>
<html>
<head>
    <title>Elder Guard | Pro Analysis</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: white; padding: 30px; text-align: center; }
        .container { max-width: 700px; margin: auto; background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
        .tabs { display: flex; justify-content: center; margin-bottom: 20px; }
        .tab { padding: 10px 20px; cursor: pointer; background: #333; border-radius: 5px; margin: 0 5px; font-weight: bold; }
        .tab.active { background: #8e44ad; }
        .panel { display: none; }
        .panel.active { display: block; }
        button { padding: 12px 25px; font-size: 16px; background: #8e44ad; color: white; border: none; border-radius: 8px; cursor: pointer; margin: 15px 0; }
        
        .score-display { font-size: 50px; font-weight: bold; margin: 10px 0; }
        .row { margin: 15px 0; padding: 15px; background: #252525; border-radius: 8px; text-align: left; font-size: 16px; border-left: 4px solid #8e44ad; }
        .val { font-weight: bold; float: right; }
        .safe { color: #2ecc71; } .danger { color: #e74c3c; } .warn { color: #f39c12; }
        #transcript-live, #transcript-up { font-size: 18px; color: #f1c40f; min-height: 40px; margin-bottom: 10px; }
        .kw-badge { display: inline-block; background: #e74c3c; color: white; padding: 3px 8px; border-radius: 4px; margin-right: 5px; font-size: 12px; }
        #llm-box { background: #2c3e50; padding: 15px; border-radius: 8px; text-align: left; font-size: 15px; line-height: 1.5; color: #ecf0f1; margin-top: 15px; border: 1px solid #34495e; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🛡️ Elder Guard (AI Reasoning)</h2>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('live')">🎤 Live Mic</div>
            <div class="tab" onclick="switchTab('upload')">📂 Upload File</div>
        </div>

        <!-- 实时录音面板 -->
        <div id="panel-live" class="panel active">
            <button id="startBtn" onclick="startLive()">START MONITORING</button>
            <div class="score-display" id="score-live">0</div>
            <div style="text-align:center; color:#aaa; margin-bottom:20px;">SCAM SCORE (0-100)</div>

            <div class="row"><span>Transcript:</span><div id="transcript-live">Waiting...</div></div>
            <div class="row"><span>Keywords:</span><div id="keywords-live" style="margin-top:10px;"></div></div>
            <div class="row"><span>AI Voice Score:</span><span id="fake-live" class="val safe">0.0%</span></div>
            <div class="row"><span>Reasoning:</span><div id="reason-live" style="margin-top:10px; color:#f39c12;">Waiting...</div></div>
        </div>

        <!-- 文件上传面板 -->
        <div id="panel-upload" class="panel">
            <input type="file" id="fileInput" accept="audio/*" style="margin-bottom: 15px; color: white;">
            <br>
            <button onclick="uploadFile()">ANALYZE WITH LLM REASONING</button>
            
            <div id="upload-result" style="display:none;">
                <div class="score-display" id="score-up">0</div>
                <div style="text-align:center; color:#aaa; margin-bottom:20px;">SCAM SCORE (0-100)</div>

                <div class="row"><span>Transcript:</span><div id="transcript-up" style="margin-top:10px;">Waiting...</div></div>
                <div class="row"><span>Keywords Found:</span><div id="keywords-up" style="margin-top:10px;"></div></div>
                <div class="row"><span>Deepfake Voice:</span><span id="fake-up" class="val safe">0.0%</span></div>
                <div class="row"><span>Pitch Variance:</span><span id="pitch-up" class="val">0.0</span></div>
                <div id="llm-box">
                    <strong>🤖 Qwen AI Deep Reasoning:</strong><br><br>
                    <span id="llm-text">Analyzing...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelector(`.tab:nth-child(${tab === 'live' ? 1 : 2})`).classList.add('active');
            document.getElementById(`panel-${tab}`).classList.add('active');
        }

        // 根据分数改变颜色
        function getScoreColor(score) {
            if (score > 65) return "danger";
            if (score > 40) return "warn";
            return "safe";
        }

        // --- 实时功能 ---
        let ws;
        async function startLive() {
            document.getElementById('startBtn').innerText = "🔴 MONITORING...";
            ws = new WebSocket("ws://192.168.55.1:8001/ws/audio");
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                document.getElementById('transcript-live').innerText = data.transcript;
                
                // 更新分数
                const scoreEl = document.getElementById('score-live');
                scoreEl.innerText = data.scam_score;
                scoreEl.className = "score-display " + getScoreColor(data.scam_score);

                // 更新概率
                const probSpan = document.getElementById('fake-live');
                probSpan.innerText = data.fake_probability + "%";
                probSpan.className = "val " + getScoreColor(data.fake_probability);

                // 更新关键词和理由
                document.getElementById('keywords-live').innerHTML = data.keywords.map(k => `<span class="kw-badge">${k}</span>`).join('');
                document.getElementById('reason-live').innerText = data.reasoning;
            };

            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            const source = audioContext.createMediaStreamSource(stream);
            const processor = audioContext.createScriptProcessor(4096, 1, 1);
            
            processor.onaudioprocess = (e) => {
                if (!ws || ws.readyState !== WebSocket.OPEN) return;
                const inputData = e.inputBuffer.getChannelData(0);
                const int16Data = new Int16Array(inputData.length);
                for (let i = 0; i < inputData.length; i++) int16Data[i] = Math.max(-1, Math.min(1, inputData[i])) * 0x7FFF;
                ws.send(int16Data.buffer);
            };
            source.connect(processor); processor.connect(audioContext.destination);
        }

        // --- 文件上传功能 ---
        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            if (!fileInput.files.length) return alert("Please select an audio file first!");
            
            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append("file", file);

            document.getElementById('upload-result').style.display = "block";
            document.getElementById('llm-text').innerText = "Qwen is thinking... (Takes ~10 seconds)";
            document.getElementById('transcript-up').innerText = "Processing...";

            try {
                const response = await fetch("http://192.168.55.1:8001/upload_audio", { method: "POST", body: formData });
                const data = await response.json();
                
                document.getElementById('transcript-up').innerText = data.transcript;
                
                const kwDiv = document.getElementById('keywords-up');
                kwDiv.innerHTML = data.keywords.length > 0 ? data.keywords.map(k => `<span class="kw-badge">${k}</span>`).join('') : "<span style='color:#666'>None</span>";

                const probSpan = document.getElementById('fake-up');
                probSpan.innerText = data.fake_probability + "%";
                probSpan.className = "val " + getScoreColor(data.fake_probability);

                document.getElementById('pitch-up').innerText = data.pitch_variance;

                // 把 LLM 的文字解析出来
                document.getElementById('llm-text').innerText = data.llm_reasoning;
                
                // 尝试从 LLM 的文字中提取分数 (比如 "Scam Score: 85")
                const match = data.llm_reasoning.match(/(\d{1,3})/);
                const extractedScore = match ? parseInt(match[0]) : (data.fake_probability > 50 ? 80 : 10);
                
                const scoreEl = document.getElementById('score-up');
                scoreEl.innerText = extractedScore;
                scoreEl.className = "score-display " + getScoreColor(extractedScore);

            } catch (err) {
                document.getElementById('transcript-up').innerText = "Error connecting to server.";
            }
        }
    </script>
</body>
</html>
